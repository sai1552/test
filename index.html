<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>గణేష్ ఉత్సవ్ 2027 | Ganesh Utsav 2027</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Ramabhadra&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <div class="wrap bar-in">
    <a class="brand" href="#top" aria-label="Home">
      <img class="brand-logo" src="logo.jpg" alt="" width="40" height="40">
      <span data-i18n="brandShort"></span>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="#programme" data-i18n="navProgramme"></a>
      <a href="#donate" data-i18n="navDonate"></a>
      <a href="#contact" data-i18n="navContact"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language / భాష">
      <button type="button" data-set-lang="te" aria-pressed="true" lang="te">తెలుగు</button>
      <button type="button" data-set-lang="en" aria-pressed="false" lang="en">English</button>
    </div>
  </div>
</header>

<main>
<section class="hero" id="top">
  <svg class="bunting" id="bunting" aria-hidden="true"></svg>
  <div class="wrap hero-inner">
    <div class="medal">
      <img class="logo" src="logo.jpg" width="520" height="520" alt="Vignahartha Friends Circle, Chinna Itikampadu">
    </div>
    <p class="ribbon" id="committee"></p>
    <h1 class="display" data-i18n="heroTitle"></h1>
    <p class="chant display" data-i18n="heroChant"></p>
    <p class="om display" data-i18n="omChant"></p>
    <p class="meta"><span id="dateRange"></span><span id="venueLine"></span></p>

    <div class="count" role="timer" aria-live="off">
      <p class="count-label" id="countLabel"></p>
      <div class="cells" id="cells">
        <div class="cell"><b id="cd-d">0</b><small data-i18n="unitDays"></small></div>
        <div class="cell"><b id="cd-h">0</b><small data-i18n="unitHours"></small></div>
        <div class="cell"><b id="cd-m">0</b><small data-i18n="unitMins"></small></div>
        <div class="cell"><b id="cd-s">0</b><small data-i18n="unitSecs"></small></div>
      </div>
    </div>

    <div class="cta-row">
      <a class="btn primary" href="#donate" data-i18n="ctaDonate"></a>
      <a class="btn ghost" href="#programme" data-i18n="ctaProgramme"></a>
    </div>
  </div>
</section>
<div class="zig" style="--from:var(--indigo);--to:var(--paper)" aria-hidden="true"></div>

<section class="section paper" id="programme">
  <div class="wrap">
    <h2 class="display" data-i18n="progTitle"></h2>
    <p class="lead" data-i18n="progIntro"></p>
    <div class="days-scroll">
      <div class="days" id="days" role="tablist" aria-label="Days"></div>
    </div>
    <div class="panel" id="panel" role="tabpanel" aria-live="polite"></div>
    <p class="note" data-i18n="progNote"></p>
  </div>
</section>
<div class="zig" style="--from:var(--paper);--to:var(--teal-deep)" aria-hidden="true"></div>

<section class="section donate" id="donate">
  <div class="wrap">
    <h2 class="display" data-i18n="donTitle"></h2>
    <p class="lead" data-i18n="donIntro"></p>

    <div class="don-grid">
      <div>
        <span class="field-label" data-i18n="amtLabel"></span>
        <div class="amts" id="amts">
          <button type="button" class="amt" data-amt="101" aria-pressed="false"><b>₹101</b><small data-i18n="seva1"></small></button>
          <button type="button" class="amt" data-amt="251" aria-pressed="false"><b>₹251</b><small data-i18n="seva2"></small></button>
          <button type="button" class="amt" data-amt="501" aria-pressed="false"><b>₹501</b><small data-i18n="seva3"></small></button>
          <button type="button" class="amt" data-amt="1001" aria-pressed="false"><b>₹1001</b><small data-i18n="seva4"></small></button>
        </div>

        <div class="inputs">
          <div>
            <label class="field-label" for="custom" data-i18n="amtOther"></label>
            <input class="input" id="custom" type="text" inputmode="numeric" autocomplete="off" placeholder="₹">
          </div>
          <div>
            <label class="field-label" for="donor" data-i18n="nameLabel"></label>
            <input class="input" id="donor" type="text" autocomplete="name">
          </div>
          <div>
            <label class="field-label" for="email" data-i18n="emailLabel"></label>
            <input class="input" id="email" type="email" inputmode="email" autocomplete="email" required>
          </div>
          <div>
            <label class="field-label" for="phone" data-i18n="phoneLabel"></label>
            <input class="input" id="phone" type="tel" autocomplete="tel">
          </div>
        </div>

        <p class="warn" id="formErr" role="alert" hidden></p>
        <div class="pay-actions">
          <a class="btn primary" id="payBtn" href="#donate" data-i18n="payBtn"></a>
        </div>
        <button type="button" class="linkbtn" id="manualToggle" data-i18n="manualToggle"></button>
        <div class="manual" id="manual" hidden>
          <p class="mtitle" data-i18n="manualTitle"></p>
          <p data-i18n="manualSteps"></p>
          <div id="manualRows"></div>
        </div>
        <p class="hint" id="payeeCheck"></p>
        <p class="warn" id="unsetWarn" hidden data-i18n="unset"></p>
      </div>

      <div class="qr-card">
        <h3 data-i18n="scanTitle"></h3>
        <div class="qr-box" id="qr"></div>
        <p data-i18n="scanHelp"></p>
        <div class="upi-row">
          <span><span data-i18n="upiIdLabel"></span>: <span class="upi-id" id="upiId"></span></span>
          <button type="button" class="copy" id="copyBtn" data-i18n="copy"></button>
        </div>
        <span class="sr" id="copyLive" aria-live="polite"></span>
      </div>
    </div>

    <div class="paid">
      <div>
        <h3 data-i18n="paidTitle"></h3>
        <p data-i18n="paidText"></p>
        <p class="hint" id="thanks" role="status" hidden></p>
      </div>
      <div class="utr">
        <input class="input" id="utr" type="text" autocomplete="off">
        <button type="button" class="btn light" id="paidBtn" data-i18n="paidBtn"></button>
      </div>
    </div>
  </div>
</section>
<div class="zig" style="--from:var(--teal-deep);--to:var(--paper)" aria-hidden="true"></div>

<section class="section paper" id="contact">
  <div class="wrap">
    <h2 class="display" data-i18n="contactTitle"></h2>
    <div class="contact">
      <div>
        <p class="who" id="contactName"></p>
        <p id="contactVenue"></p>
      </div>
      <div class="contact-actions">
        <a class="btn outline" id="callBtn" href="#contact" data-i18n="callBtn"></a>
        <a class="btn outline" id="waBtn" href="#contact" target="_blank" rel="noopener">WhatsApp</a>
        <a class="btn outline" id="mapBtn" href="#contact" target="_blank" rel="noopener" data-i18n="mapBtn" hidden></a>
      </div>
    </div>
  </div>
</section>
<div class="zig" style="--from:var(--paper);--to:var(--indigo-deep)" aria-hidden="true"></div>
</main>

<footer class="foot"><p data-i18n="footerChant"></p><p class="foot-name" id="footName"></p></footer>

<div class="modal" id="appModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="sheet">
    <h3 id="modalTitle" data-i18n="appsTitle"></h3>
    <p class="sheet-amt" id="modalAmt"></p>
    <p class="sheet-note" data-i18n="appsNote"></p>
    <div class="apps" id="apps">
      <button type="button" class="app" data-app="phonepe" style="--c:#5F259F">PhonePe</button>
      <button type="button" class="app" data-app="gpay" style="--c:#1A73E8">Google Pay</button>
      <button type="button" class="app" data-app="paytm" style="--c:#00BAF2">Paytm</button>
      <button type="button" class="app" data-app="bhim" style="--c:#F26B1D">BHIM</button>
      <button type="button" class="app wide" data-app="other" style="--c:#6B6B6B" data-i18n="otherApp"></button>
    </div>
    <button type="button" class="linkbtn" id="modalCopy" data-i18n="modalCopy"></button>
    <button type="button" class="btn outline sheet-close" id="modalClose" data-i18n="closeBtn"></button>
  </div>
</div>

<button type="button" class="sound" id="soundBtn" aria-pressed="false" hidden></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>
</body>
</html>
